name: Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  LAB_ID: aq7-c4f81e-k3x

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lab5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './lab5/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test
