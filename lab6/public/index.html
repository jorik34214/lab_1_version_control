<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід до системи</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      padding: 40px 48px;
      width: 360px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #3498db;
    }
    button {
      width: 100%;
      padding: 11px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #2980b9; }
    #successMessage {
      display: none;
      margin-top: 16px;
      padding: 10px;
      background: #d4edda;
      color: #155724;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Авторизація користувача</h1>
    <form id="loginForm">
      <label for="username">Логін</label>
      <input id="username" type="text" placeholder="Введіть логін" required />
      <label for="password">Пароль</label>
      <input id="password" type="password" placeholder="Введіть пароль" required />
      <button id="loginButton" type="submit">Увійти</button>
    </form>
    <p id="successMessage">✓ Вхід виконано успішно!</p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('successMessage').style.display = 'block';
    });
  </script>
</body>
</html>
